name: Deploy static content to Pages

on:
  # Запускать при пуше в ветку main
  push:
    branches: ["main"]
  # Позволяет запускать вручную из вкладки Actions
  workflow_dispatch:

# Разрешения, необходимые для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только одно одновременное развертывание
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Если ваш сайт лежит в корне репозитория, оставьте точку.
          # Если сайт в папке (например, dist или public), укажите путь: './dist'
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
